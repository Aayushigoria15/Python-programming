{% extends 'header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% if msg %}
        <b class="msgs">{{msg}}</b>
    {% endif %}
   <form class="contact-form " name="login" method="POST" action="{% url 'verify-otp' %}">
    {% csrf_token %}
    <table>
        <tr>
            <td>OTP</td>
            <td><input type="text" name="otp" ></td>
        </tr>
        <tr>
            <td  align ="center">
                <input type="submit" value="Verify OTP" class="btn btn-primary">
            </td>
        </tr>
    </table>

   </form>
</body>
</html>
{% endblock %}
