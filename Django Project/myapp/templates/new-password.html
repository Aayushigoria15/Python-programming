{% extends 'header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% if msg %}
        <b class="msgs">{{msg}}</b>
    {% endif %}
   <form class="contact-form " method="POST" action="{% url 'new-password' %}">
    {% csrf_token %}
    <table>

        <tr>
            <td>New Password</td>
           <td><input type="text" name="new_password" ></td>
        </tr>
        <tr>
            <td>Confirm New Password</td>
           <td><input type="text" name="cnew_password" ></td>
        </tr>
        <tr>
            
            <td colspan="2" align ="center">
                <input type="submit" value="Update Password" class="btn btn-primary">
            </td>
        </tr>
    </table>

   </form>
</body>
</html>
{% endblock %}
